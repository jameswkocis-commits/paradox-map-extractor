[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paradox-map-extractor"
version = "0.1.0"
description = "Extract GIS-ready political maps from EU4 screenshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "Pillow>=10", "opencv-python>=4.8",
  "rasterio>=1.3", "shapely>=2", "geopandas>=0.14", "pyogrio>=0.7",
  "scikit-learn>=1.3"
]
[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-cov>=5"]
[project.scripts]
paradox-map = "paradox_mapper.cli:main"
paradox-map-gui = "paradox_mapper.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paradox_mapper"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
